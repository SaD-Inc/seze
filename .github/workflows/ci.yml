name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://seze:seze@127.0.0.1:54331/seze
      TEST_DATABASE_URL: postgresql://seze:seze@127.0.0.1:54331/seze
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: seze
          POSTGRES_PASSWORD: seze
          POSTGRES_USER: seze
        ports:
          - 54331:5432
        options: >-
          --health-cmd "pg_isready -U seze -d seze"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit production dependencies
        run: bun audit --production

      - name: Apply database migrations
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: bun run db:migrate

      - name: Check schema and migration consistency
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          bun run db:check
          bun run db:generate
          if [ -n "$(git status --porcelain -- drizzle)" ]; then
            git status -- drizzle
            echo "Database schema changed without a committed migration." >&2
            exit 1
          fi

      - name: Verify source and production build
        run: bun run check

      - name: Smoke test standalone production server
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          HOSTNAME: localhost
          PORT: "3999"
        run: |
          node .next/standalone/start.mjs &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=""
          for _ in $(seq 1 30); do
            if curl --silent --fail --max-time 5 --output /dev/null "http://localhost:3999/api/health"; then
              ready="1"
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              echo "Standalone server exited before becoming ready." >&2
              exit 1
            fi
            sleep 1
          done

          if [ -z "${ready}" ]; then
            echo "Standalone server did not become ready within 30 seconds." >&2
            exit 1
          fi

          for path in / /rules /api/health; do
            status=$(curl --silent --max-time 15 --output /dev/null --write-out "%{http_code}" "http://localhost:3999${path}" || true)
            if [ "${status}" != "200" ]; then
              echo "GET ${path} returned ${status}, expected 200." >&2
              exit 1
            fi
          done
