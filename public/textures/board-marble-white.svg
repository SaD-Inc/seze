      <path d="M-85 865 C150 662 323 875 524 716 S831 529 1096 623" stroke-width="4.1" opacity="0.52"/>
      <path d="M291-103 C184 150 358 292 271 489 S165 792 303 1115" stroke-width="3.3" opacity="0.44"/>
      <path d="M448 188 C492 305 430 390 271 489" stroke-width="2.0" opacity="0.48"/>
      <path d="M524 716 C652 762 671 899 631 1101" stroke-width="2.2" opacity="0.42"/>
      <path d="M723 75 C796 214 731 322 890 405 S1022 502 1100 529" stroke-width="2.1" opacity="0.46"/>
