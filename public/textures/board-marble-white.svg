<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <filter id="stone" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.68" numOctaves="3" seed="43" result="grain"/>
      <feColorMatrix in="grain" type="saturate" values="0" result="gray-grain"/>
      <feComponentTransfer in="gray-grain" result="soft-grain">
        <feFuncA type="table" tableValues="0 0.075"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="soft-grain" mode="multiply"/>
    </filter>
    <filter id="warp" x="-18%" y="-18%" width="136%" height="136%" filterUnits="objectBoundingBox">
      <feTurbulence type="fractalNoise" baseFrequency="0.006 0.021" numOctaves="3" seed="47" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="46" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="#eeeae3"/>
  <rect width="1024" height="1024" fill="#d8d5cf" opacity="0.28" filter="url(#stone)"/>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#warp)">
    <g stroke="#777a7e" opacity="0.14" filter="url(#soften)">
      <path d="M-104 228 C116 90 249 314 448 188 S777 29 1116 183" stroke-width="18"/>
      <path d="M-85 865 C150 662 323 875 524 716 S831 529 1096 623" stroke-width="16"/>
      <path d="M291-103 C184 150 358 292 271 489 S165 792 303 1115" stroke-width="13"/>
    </g>

    <g stroke="#74777b">
