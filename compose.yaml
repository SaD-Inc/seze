services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: seze
      POSTGRES_PASSWORD: seze
      POSTGRES_USER: seze
    ports:
      - "127.0.0.1:54331:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seze -d seze"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
